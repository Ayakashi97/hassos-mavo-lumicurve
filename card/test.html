<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brew card test</title>
<style>
  body{margin:0;padding:16px;background:radial-gradient(circle at 20% 0,#3a2c1c,#14100b);min-height:100vh;font:14px system-ui;color:#eee}
  body.light{background:#eef0f3;color:#222;--primary-text-color:#1b1b1b;--card-background-color:#fff}
  .w{max-width:var(--w,440px);margin:auto}.bar{max-width:1100px;margin:0 auto 12px;display:flex;gap:6px;flex-wrap:wrap}
  body.glass{background:radial-gradient(circle at 20% 0,#22304d,#0b1020);--gold:#e8b54a;--paper:#f4efe6;--muted:#a3adc2}
  body.glass .w{padding:20px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px)}
  button{font:inherit;padding:6px 12px;border-radius:999px;border:1px solid #888;background:transparent;color:inherit;cursor:pointer}
</style>
<div class="bar" id="bar"></div>
<div class="w"><mavo-lumicurve-card id="c"></mavo-lumicurve-card></div>
<script>document.write('<script src="../custom_components/mavo_lumicurve/www/mavo-lumicurve-card.js?' + Date.now() + '"><\/script>')</script>
<script>
  // every key except the data source is optional; see docs/CONFIG.md
  const base = { brews_url: '../data/brews.json',
    targets: { espresso: { time: [22, 30], yield: [34, 42], flow: [1.3, 2.2], ratio: [1.8, 2.5] }, pourover: { time: [150, 210], yield: [250, 310], flow: [1.3, 2], ratio: [15, 17] } } };
  const presets = {
    'Default (new look)': {},
    'Surface none (in glass dialog)': { surface: 'none', _glass: 1 },
    'Wide (forced)': { layout: 'wide' },
    'Compact (forced)': { layout: 'compact' },
    'Demo data': { demo: true },
    'Time sources (exact / ≤ / unknown)': { brews: [
      { id: 'a', seq: 0, ts: '? 03:22:14', real_ts: null, mode: 'espresso', valid: true, yield_g: 36, time_s: 24, flow_gs: 1.5, curve: [[0, 0], [24, 36]] },
      { id: 'b', seq: 1, ts: '2022-03-01 20:08:39', real_ts: '2026-10-11 04:34:36', ts_src: 'latest', mode: 'espresso', valid: true, yield_g: 38, time_s: 25, flow_gs: 1.5, curve: [[0, 0], [25, 38]] },
      { id: 'c', seq: 2, ts: '? 01:00:00', real_ts: '2026-11-22 11:56:00', ts_src: 'seen', mode: 'espresso', valid: true, yield_g: 37, time_s: 26, flow_gs: 1.4, curve: [[0, 0], [26, 37]] },
      { id: 'd', seq: 3, ts: '2022-02-22 07:40:17', real_ts: '2026-11-19 16:06:14', ts_src: 'exact', mode: 'espresso', valid: true, yield_g: 36.5, time_s: 25, flow_gs: 1.5, curve: [[0, 0], [25, 36.5]] }] },
    'No brews': { brews: [] },
    'Classic (theme dark)': { theme: 'dark' },
    'Blue accent': { accent: '#5aa9ff', color_pill: '#2b4f8a', background: '#1c2a40', background_end: '#101a2a' },
    'HA theme (light page)': { theme: 'ha', accent: '#c47f00' },
    'English, big text': { language: 'en', font_scale: 115, title: 'Coffee log' },
    'Minimal (tiles only)': { show_graph: false, show_chart: false, show_title: false, show_filter: false, show_notes: false },
    'Square, flat': { border_radius: 4, background: '#202020', accent: '#ff5d73', color_in: '#4ade80', color_out: '#fbbf24' },
  };
  const bar = document.getElementById('bar');
  for (const [name, cfg] of Object.entries(presets)) {
    const b = document.createElement('button'); b.textContent = name;
    b.onclick = () => { const { _glass, ...k } = cfg; document.body.classList.toggle('light', k.theme === 'ha'); document.body.classList.toggle('glass', !!_glass); c.setConfig({ ...base, ...k }); };
    bar.appendChild(b);
  }
  for (const w of [375, 768, 1000]) { const b = document.createElement('button'); b.textContent = w + ' px'; b.onclick = () => document.querySelector('.w').style.setProperty('--w', w + 'px'); bar.appendChild(b); }
  document.querySelector('.w').style.setProperty('--w', (new URLSearchParams(location.search).get('w') || 440) + 'px');
  c.setConfig(base);
</script>
