name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  hacs:
    runs-on: ubuntu-latest
    continue-on-error: true  # needs repository description and topics on GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check custom_components/mavo_lumicurve/www/mavo-lumicurve-card.js
